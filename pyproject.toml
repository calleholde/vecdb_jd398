[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "calleholde-vecdb_jd398"
version = "0.1.0"
description = "抽取数值做分布分析，用中位数绝对偏差识别向量数据库内核工程师·偏好数据的成对噪声上的离群点"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "calleholde" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://calleholde.github.io"
Repository = "https://github.com/calleholde/vecdb_jd398"
Issues = "https://github.com/calleholde/vecdb_jd398/issues"

[project.scripts]
vecdb_jd398 = "vecdb_jd398:main"

[tool.setuptools]
py-modules = ["vecdb_jd398"]
